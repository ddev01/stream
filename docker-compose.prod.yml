services:
  php:
    image: ${SPIN_IMAGE_DOCKERFILE} # 👈 Change this if you're not using `spin deploy`
    environment:
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true" # 👈 Remove this line if you don't want Laravel Automations
      APP_ENV: "${SPIN_DEPLOYMENT_ENVIRONMENT}" # 👈 Remove this if you're not using `spin deploy`
      HEALTHCHECK_PATH: "/up" # Use Laravel's built-in health route
      SSL_MODE: full
      DB_HOST: stream-postgres
      REDIS_HOST: stream-redis
    networks:
      - default
      - web-public
    volumes:
      - "storage_private:/var/www/html/storage/app/private/"
      - "storage_public:/var/www/html/storage/app/public/"
      - "storage_sessions:/var/www/html/storage/framework/sessions"
      - "storage_logs:/var/www/html/storage/logs"
      - "database_sqlite:/var/www/html/.infrastructure/volume_data/sqlite"
    deploy:
      replicas: 1
      update_config:
        failure_action: rollback
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.stream.rule=Host(`${SPIN_APP_DOMAIN}`)"
        - "traefik.http.routers.stream.entrypoints=websecure"
        - "traefik.http.routers.stream.tls=true"
        - "traefik.http.routers.stream.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.stream.service=stream"
        # serversideup/php listens on 8080 (http) and 8443 (https).
        # With SSL_MODE=full it redirects http→https, so we route to https/8443.
        - "traefik.http.services.stream.loadbalancer.server.port=8443"
        - "traefik.http.services.stream.loadbalancer.server.scheme=https"
        - "traefik.http.services.stream.loadbalancer.healthcheck.path=/up"
        - "traefik.http.services.stream.loadbalancer.healthcheck.interval=10s"
        - "traefik.http.services.stream.loadbalancer.healthcheck.timeout=5s"
        - "traefik.http.services.stream.loadbalancer.healthcheck.scheme=https"

        # Horizon path-based with IP whitelist (matches /horizon, /horizon/*)
        - "traefik.http.routers.horizon.rule=Host(`${SPIN_APP_DOMAIN}`) && PathPrefix(`/horizon`)"
        - "traefik.http.routers.horizon.priority=100"
        - "traefik.http.routers.horizon.entrypoints=websecure"
        - "traefik.http.routers.horizon.tls=true"
        - "traefik.http.routers.horizon.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.horizon.middlewares=horizon-ipwhitelist"
        - "traefik.http.routers.horizon.service=stream"

        # Telescope path-based with IP whitelist (matches /telescope, /telescope/*)
        - "traefik.http.routers.telescope.rule=Host(`${SPIN_APP_DOMAIN}`) && PathPrefix(`/telescope`)"
        - "traefik.http.routers.telescope.priority=100"
        - "traefik.http.routers.telescope.entrypoints=websecure"
        - "traefik.http.routers.telescope.tls=true"
        - "traefik.http.routers.telescope.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.telescope.middlewares=telescope-ipwhitelist"
        - "traefik.http.routers.telescope.service=stream"

        # IP Whitelist middleware for Horizon
        # Reads from HORIZON_ALLOWED_IPS environment variable (comma-separated)
        # Format: "1.2.3.4/32,5.6.7.8/32" or single IP "1.2.3.4/32"
        # Note: /32 means a single IP address (CIDR notation)
        - "traefik.http.middlewares.horizon-ipwhitelist.ipwhitelist.sourcerange=${HORIZON_ALLOWED_IPS}"

        # IP Whitelist middleware for Telescope
        # Reads from TELESCOPE_ALLOWED_IPS environment variable (comma-separated)
        # Format: "1.2.3.4/32,5.6.7.8/32" or single IP "1.2.3.4/32"
        # Note: /32 means a single IP address (CIDR notation)
        - "traefik.http.middlewares.telescope-ipwhitelist.ipwhitelist.sourcerange=${TELESCOPE_ALLOWED_IPS}"

  postgres:
    image: postgres:16-alpine
    networks:
      default:
        aliases:
          - stream-postgres
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    deploy:
      placement:
        constraints:
          - node.role==manager
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_shared:/shared

  redis:
    command: "redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      default:
        aliases:
          - stream-redis
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s

  horizon:
    image: ${SPIN_IMAGE_DOCKERFILE}
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_grace_period: 30s
    stop_signal: SIGTERM
    environment:
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true"
      APP_ENV: "${SPIN_DEPLOYMENT_ENVIRONMENT}"
      HEALTHCHECK_PATH: "/up"
      SSL_MODE: full
      DB_HOST: stream-postgres
      REDIS_HOST: stream-redis
    volumes:
      - "storage_private:/var/www/html/storage/app/private/"
      - "storage_public:/var/www/html/storage/app/public/"
      - "storage_sessions:/var/www/html/storage/framework/sessions"
      - "storage_logs:/var/www/html/storage/logs"
    deploy:
      update_config:
        failure_action: rollback
        parallelism: 1
        delay: 5s
        order: stop-first
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s

  ssh:
    # We use an SSH image so we can securely tunnel into the Docker network with
    # tools like Sequel Pro, TablePlus, Sequel Ace, etc.
    # Learn more how to secure your tunnel here: https://github.com/serversideup/docker-ssh
    image: serversideup/docker-ssh:v2.0.0
    ports:
      - target: 2222
        published: 2222
        mode: host
    environment:
      # Change the keys below to your own keys
      AUTHORIZED_KEYS: >
        "# Start Keys
         ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPifqshxdjUmSi8eBV0QfrVw2871N+uhMdra2koE2bDK macbook
         # End Keys"
      # You can lock to a specific IP too (AllowUsers tunnel@1.2.3.4)
      ALLOWED_IPS: "AllowUsers tunnel"
    volumes:
      - tunnel_ssh_host_keys:/etc/ssh/ssh_host_keys
    deploy:
      placement:
        constraints:
          - node.role==manager
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s

volumes:
  storage_private:
  storage_public:
  storage_sessions:
  storage_logs:
  database_sqlite:
  postgres_data:
  postgres_shared:
  redis_data:
  tunnel_ssh_host_keys:

networks:
  default:
  web-public:
    external: true
    name: spin-production_web-public
